<style>
:root{color-scheme:light;--blue:#0B2FD0;--navy:#0A1A6B;--red:#D12525;--ice:#EEF2FF;--ink:#14183A;--grey:#5B6180;--line:#D9DEF5;--amb:#F2A516;--grn:#1B8A4B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,Arial,sans-serif;background:#fff;color:var(--ink);font-size:15px}
header{background:var(--navy);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:18px}header small{opacity:.8;font-size:12px}
.clock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stick{position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid var(--line)}
.days,.views{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto}.views{padding-bottom:6px}
.d{flex:1;min-width:84px;padding:8px 6px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;color:var(--ink);text-align:center;font-size:14px}
.d small{display:block;font-weight:400;font-size:11px;color:var(--grey)}.d.on{background:var(--blue);border-color:var(--blue);color:#fff}.d.on small{color:#dbe2ff}
.v{flex:1;padding:8px 10px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;font-size:14px;color:var(--grey);white-space:nowrap}.v.on{color:var(--red);border-bottom-color:var(--red)}
main{padding:12px 16px 80px;max-width:1100px;margin:auto}
.bar{height:10px;background:var(--ice);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn);width:0}
.sum{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--grey);margin:6px 0 10px}.sum b{color:var(--ink)}
h2{font-size:13px;color:var(--red);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pc{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer}
.pc.late{border-color:var(--amb);background:#FFF8E6}.pc.issue{border-color:var(--red);background:#FDECEC}.pc.ok{border-color:#BFE3CD}
.pc b{font-size:16px;color:var(--blue)}.pc .r{font-size:12px;color:var(--grey)}
.pc .n{font-size:13px;margin-top:6px;line-height:1.3}
.pc .cnt{float:right;font-size:12px;color:var(--grey)}
.mini{height:6px;background:var(--ice);border-radius:4px;margin:6px 0;overflow:hidden}.mini i{display:block;height:100%;background:var(--grn)}
.row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.row.done{background:#F0FAF4;border-color:#BFE3CD}.row.late{background:#FFF8E6;border-color:#F3D68A}.row.issue{background:#FDECEC;border-color:#F0B4B4}.row.now{box-shadow:0 0 0 2px var(--blue)}
.line{display:flex;align-items:center;gap:10px}.time{font-weight:700;color:var(--red);min-width:78px;font-size:14px}
.tt{flex:1;cursor:pointer}.tt b{display:block;font-size:15px;font-weight:600;line-height:1.3}.tt small{color:var(--grey);font-size:12.5px}
.st{display:flex;gap:6px}.st button{width:68px;padding:10px 0;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-weight:600;color:var(--grey)}
.st button.a-done{background:var(--grn);border-color:var(--grn);color:#fff}.st button.a-late{background:var(--amb);border-color:var(--amb);color:#fff}.st button.a-issue{background:var(--red);border-color:var(--red);color:#fff}
.det{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}.row.open .det{display:block}
.kv{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;font-size:13px}.kv span{color:var(--grey)}.kv b{font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;background:#FFE9B8;color:#8a5a00}.badge.od{background:#FBD2D2;color:#8a1b1b}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.chip{padding:7px 12px;border:1.5px solid var(--line);border-radius:20px;background:#fff;font-size:13px;white-space:nowrap}.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
input,select,textarea{font:inherit;font-size:15px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);background:#fff;width:100%}
.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;font-size:15px}.btn.g{background:#fff;color:var(--red);border:1.5px solid var(--line)}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.card.res{background:#F0FAF4}.card p{margin:4px 0;font-size:14px}.small{font-size:12.5px;color:var(--grey)}
.h{display:flex;justify-content:space-between;font-size:13px;color:var(--grey)}
a.call{color:var(--blue);font-weight:700;text-decoration:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
label{font-size:12px;color:var(--grey);display:block;margin-bottom:3px}
</style></head><body>

function timeline(fixed){
 const T=fixed||ui.team,s=st(),R=rows(T);let h=summary(T);
 if(!fixed)h+=`<select onchange="ui.team=this.value;ui.pic='All';save();render()" style="margin-bottom:8px;font-weight:700;color:var(--blue)">${["All-crew"].concat(DATA.teams.map(x=>x.name)).map(x=>`<option value="${esc(x)}" ${ui.team===x?"selected":""}>${x==="All-crew"?"All-crew run sheet":"Team: "+esc(x)}</option>`).join("")}</select>`;else h+=`<h2 style="margin-top:0">My checklist: Control Tower</h2>`;
 h+=`<div class="chips"><button class="chip ${ui.pic==="All"?"on":""}" onclick="ui.pic='All';save();render()">Everyone</button>${PICS.map(p=>`<button class="chip ${ui.pic===p?"on":""}" onclick="ui.pic='${p}';save();render()">${p}</button>`).join("")}<label class="chip" style="margin:0"><input type="checkbox" style="width:auto" ${ui.full?"checked":""} onchange="ui.full=this.checked;save();render()"> Full details</label><label class="chip" style="margin:0"><input type="checkbox" style="width:auto" ${ui.hide?"checked":""} onchange="ui.hide=this.checked;save();render()"> Hide done</label></div>`;
 const nowI=isToday()?R.find(x=>!s.s[x.i]&&startMin(x.r[0])!==null&&startMin(x.r[0])>=nowMin()-15):null;
 R.forEach(({r,i})=>{
  if(ui.pic!=="All"&&!pics(r).includes(ui.pic))return;const v=s.s[i]||"";if(ui.hide&&v==="done")return;
  const od=overdue({r,i},s),prop=r[7]==="Proposed",op=ui.full||s.o[i];
  h+=`<div class="row ${v} ${op?"open":""} ${nowI&&nowI.i===i?"now":""}"><div class="line"><div class="time">${esc(r[0])}</div><div class="tt" onclick="tgl(${i})"><b><span class="dot" style="background:${CAT[r[1]]||"#0A1A6B"}"></span>${esc(r[2])}${prop?'<span class="badge">Proposed</span>':""}${od?'<span class="badge od">Overdue</span>':""}</b><small>${esc(r[4])}${r[6]?" | "+esc(r[6]):""}</small></div>
  <div class="st">${["done","late","issue"].map(k=>`<button class="${v===k?"a-"+k:""}" onclick="setSt(${i},'${k}')">${LABEL[k]}</button>`).join("")}</div></div>
  <div class="det"><div class="kv"><span>Category</span><b>${esc(r[1])}</b><span>Where</span><b>${esc(r[3]||"-")}</b><span>PIC</span><b>${esc(r[4])}</b><span>With</span><b>${esc(r[5]||"-")}</b><span>Cue</span><b>${esc(r[6]||"-")}</b><span>Source</span><b>${esc(r[7])}</b></div>${r[9]?`<div class="small" style="margin:6px 0">Full detail: ${esc(r[9])}</div>`:""}<input placeholder="Note (what the PIC reported)" value="${esc(s.n[i])}" onchange="setN(${i},this.value)" style="margin-top:6px"></div></div>`});
 document.getElementById("main").innerHTML=h;
}
function teamsView(){
 const s=st();document.getElementById("main").innerHTML=`<div class="small" style="margin-bottom:8px">Tap a team to open its detailed run sheet for this day.</div><div class="two">`+DATA.teams.map(t=>{const R=rows(t.name),dn=R.filter(x=>s.s[x.i]==="done").length;
  return `<div class="pc" onclick="ui.team='${t.name.replace(/'/g,"\\'")}';ui.view='Timeline';ui.pic='All';save();render()"><b>${esc(t.name)}</b><span class="cnt">${dn}/${R.length}</span><div class="mini"><i style="width:${R.length?dn/R.length*100:0}%"></i></div>${t.hdr.map(h=>`<div class="r" style="margin-top:4px"><b style="color:var(--ink)">${esc(h[0])}:</b> ${esc(h[1])}</div>`).join("")}</div>`}).join("")+`</div>`}
function tgl(i){const s=st();s.o[i]=!s.o[i];save();render()}
function setSt(i,k){const s=st();s.s[i]=s.s[i]===k?"":k;save();render()}
function setN(i,v){st().n[i]=v;save()}
function issues(){
 const s=st();
 let h=`<h2>Log an issue</h2><div class="two"><div><label>Time</label><input id="it" type="time"></div><div><label>Area</label><select id="ia"><option>Central Arena</option><option>Zona Nyaman</option><option>Lokalhood</option><option>Sponsor Area</option><option>Stage</option><option>Entrance</option><option>Expo LED</option><option>App / POS</option><option>Security</option><option>Other</option></select></div><div><label>Owner</label><input id="io" placeholder="Who handles it"></div></div><div style="margin:8px 0"><label>What happened and action taken</label><textarea id="id" rows="2"></textarea></div><button class="btn" onclick="addI()">Add issue</button><h2>Issues</h2>`;
 h+=s.iss.length?s.iss.map((x,i)=>`<div class="card ${x.res?"res":""}"><div class="h"><span>${esc(x.t||"--:--")} | ${esc(x.a)} | ${esc(x.o||"no owner")}</span><span>${x.res?"Resolved":"Open"}</span></div><p>${esc(x.d)}</p><button class="btn g" onclick="togI(${i})">${x.res?"Reopen":"Mark resolved"}</button></div>`).join(""):'<div class="small">No issues logged for this day.</div>';
 document.getElementById("main").innerHTML=h;
}
function addI(){const d=document.getElementById("id").value.trim();if(!d)return;st().iss.unshift({t:document.getElementById("it").value,a:document.getElementById("ia").value,o:document.getElementById("io").value,d,res:false});save();render()}
function togI(i){const x=st().iss[i];x.res=!x.res;save();render()}
function cp(){document.getElementById("main").innerHTML=`<div class="small" style="margin-bottom:8px">Decision maker owns the call. Control Tower is informed every time.</div>`+DATA.cp.map(r=>`<div class="card"><b style="color:var(--red)">${esc(r[0])}</b><p><span class="small">Trigger:</span> ${esc(r[1])}</p><p><span class="small">First response:</span> ${esc(r[2])}</p><p><span class="small">Decision maker:</span> <b>${esc(r[3])}</b></p></div>`).join("")}
function cts(){let h="",g="";DATA.contacts.forEach(c=>{if(c[0]!==g){g=c[0];h+=`<h2>${esc(g)}</h2>`}const ph=c[4]?`<a class="call" href="tel:${c[4].replace(/[^+\d]/g,"")}">${esc(c[4])}</a>`:'<span class="small">TBC</span>';h+=`<div class="card"><div class="h"><b style="color:var(--blue)">${esc(c[1]||c[2])}</b>${ph}</div><p>${esc(c[1]?c[2]:"")}</p><div class="small">${esc(c[3])}</div></div>`});document.getElementById("main").innerHTML=h}
render();setInterval(()=>{if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()},60000);
</script></body></html>
